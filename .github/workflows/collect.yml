name: collect
on:
  schedule:
    # 정각·30분은 GitHub 부하가 몰려 실행이 자주 밀리거나 빠져서 피한다
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "주말 구간에도 수집"
        type: boolean
        default: false
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: data.json 만들기
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: uv run python -m collector.build --out site/data.json ${{ inputs.force && '--force' || '' }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
